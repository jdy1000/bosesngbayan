# Local Supabase stack configuration (`pnpm db:start`). Production settings live in the
# Supabase dashboard — mirror the [auth] choices there (see docs/SECURITY.md checklist).
project_id = "boses-ng-bayan"

[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 56323

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# Local: `pnpm dev` serves :3000, `pnpm start -p 3210` serves :3210. Production values go in the dashboard.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/auth/callback", "http://localhost:3210/admin/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public registration: staff accounts are created only by invitation (Studio → Team) or the
# owner bootstrap script, both using the service role on the server.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600
